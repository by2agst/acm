<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACM Story Diagrams</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#dfe3e8;--accent:#1f3864;--ok:#c6efce;--part:#ffeb9c;--bad:#ffc7ce;--none:#e5e7eb;--warn:#f8cbad}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#171d26;--ink:#e6e9ee;--mute:#98a2b3;--line:#2a3340;--accent:#8fb0ff;--ok:#1f4d33;--part:#5a4a14;--bad:#5a2430;--none:#2a3340;--warn:#5a3a24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{padding-top:22px;padding-bottom:12px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang a{padding:6px 14px;text-decoration:none;color:var(--mute);font-weight:600;font-size:13px}.lang a+a{border-left:1px solid var(--line)}
.lang a.on{background:var(--accent);color:var(--bg)}.lang a:not(.on):hover{color:var(--ink)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);z-index:2}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;height:38px}
input[type=text]{flex:1;min-width:220px}
select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}.chk input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
main{padding-top:8px;padding-bottom:40px}
.top{align-items:center}.acts{display:flex;gap:10px;align-items:center;flex:none}
a.xl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;background:var(--card)}
a.xl:hover{border-color:var(--accent);color:var(--accent)}
.sumbox{margin:4px auto 14px;overflow-x:auto}.sumbox h2{font-size:15px;margin:14px 0 8px}
table.sum{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum th,.sum td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.sum th{color:var(--mute);font-weight:600;font-size:12px;background:var(--bg)}.sum tr:last-child td{border-bottom:0}
.sum td a{color:var(--accent);font-weight:600;text-decoration:none}.sum td a:hover{text-decoration:underline}
.sum .n{font-variant-numeric:tabular-nums}.sum .z{color:var(--mute)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0}summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
summary span{color:var(--mute);font-weight:400}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table.st{border-collapse:collapse;width:100%}
.st th{text-align:left;color:var(--mute);font-size:12px;font-weight:600;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);vertical-align:bottom}
.st th small{display:block;font-weight:400}
.st td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}.st tr:last-child td{border-bottom:0}
.st td.id{font-weight:600;white-space:nowrap}.st td.d{color:var(--mute);min-width:340px}.st td.nw{white-space:nowrap}
.stp{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.stp .tag{margin:0}
button.stp{background:none;border:0;padding:4px;margin:-4px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
button.stp:hover{background:var(--bg)}button.stp:focus-visible{outline:2px solid var(--accent)}
.cap{font-size:11px;color:var(--mute);margin-top:2px;white-space:normal;max-width:110px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:82vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dh h3{margin:0;font-size:15px}.dh button{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
#db{padding:6px 18px 4px}.grp{margin:14px 0}.grp ul{margin:8px 0 0;padding-left:20px}.grp li{margin:6px 0}
.why{color:var(--mute);font-size:13px;margin-top:2px}.dn{margin:0;padding:10px 18px 16px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
.st .n{font-variant-numeric:tabular-nums}.st .z{color:var(--mute)}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;margin-right:6px;color:var(--ink)}
.Sesuai{background:var(--ok)}.Sebagian{background:var(--part)}.Beda{background:var(--warn)}.Tidak{background:var(--bad)}.Removed{background:var(--bad)}.Belum{background:var(--none)}
a.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:3px 10px;text-decoration:none;margin-left:6px}
a.btn:hover{background:var(--accent);color:var(--bg)}
.empty{padding:30px;text-align:center;color:var(--mute)}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.note{background:var(--part);color:var(--ink);border-radius:8px;padding:10px 14px;margin:14px 0 10px;font-size:13px}
.nbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}.nsum{color:var(--mute);margin:4px 0 10px;font-size:13px}
button.btn2{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;padding:3px 10px;font:inherit;cursor:pointer}
button.btn2:hover{background:var(--accent);color:var(--bg)}
.ns h4{margin:14px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}.ns p{margin:0}.ns ul,.ns ol{margin:4px 0 0;padding-left:20px}.ns li{margin:4px 0}
.ns code{font-size:12px;word-break:break-all}

</style></head><body>
<header class="wrap"><div class="top"><div><h1>ACM Story Diagrams</h1><p id="sum"></p></div><div class="acts"><a class="xl" href="ACM-Code-Flow-Evidence.xlsx" download>&#8681; Export Excel</a><nav class="lang" aria-label="Language"><a href="index.html" class="on">EN</a><a href="index.id.html">ID</a></nav></div></div></header>

<div class="wrap"><div class="tabs" id="tabs" role="tablist"></div></div>
<div class="bar"><div class="wrap">
<input type="text" id="q" placeholder="Search story ID or description (e.g. ACM1.6, Supporter)">
<select id="v"><option value="">All verdicts</option><option value="Sesuai">Matches</option><option value="Sebagian">Partial</option><option value="Tidak sesuai">Mismatch</option><option value="Belum di-trace">Not traced</option><option value="Removed">Removed</option></select>
<label class="chk"><input type="checkbox" id="d"> Has diagram only</label>
</div></div>
<main id="list" class="wrap"></main>
<main id="newp" class="wrap" hidden><div class="note" id="nbanner"></div><div class="nbar"><input type="text" id="nq"><select id="nt"></select></div><div class="nsum" id="nsum"></div><div id="ntab"></div></main>
<dialog id="dlg"><div class="dh"><h3 id="dt"></h3><button id="dx" aria-label="Close">&times;</button></div><div id="db"></div></dialog>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=v=>v.split(" ")[0];
function render(){
  const q=document.getElementById("q").value.toLowerCase(),v=document.getElementById("v").value,d=document.getElementById("d").checked;
  const rows=S.filter(s=>(!v||s.verdict===v)&&(!d||s.link)&&(!q||(s.id+" "+s.desc).toLowerCase().includes(q)));
  const by={};rows.forEach(s=>(by[s.epic]??=[]).push(s));
  const out=Object.keys(by).map(Number).sort((a,b)=>a-b).map(e=>{
    const g=by[e],withD=g.filter(s=>s.link).length;
    return `<details ${q||v||d||withD?"open":""}><summary>${T.epic} ${e} <span>${g.length} ${T.stories} · ${withD} ${T.withd}</span></summary><div class="tw"><table class="st"><thead><tr>${T.h.map((h,i)=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`+g.map(s=>`
    <tr><td class="id">${esc(s.id)}</td><td class="d">${esc(s.desc)}</td><td class="nw n">${esc(s.points)}</td><td class="nw">${esc(s.status)}</td>
    <td class="nw"><span class="tag ${cls(s.verdict)}">${esc(T.v[s.verdict]||s.verdict)}</span></td>
    <td class="nw n">${s.pct==null?'<span class="z">-</span>':Math.round(s.pct*100)+"%"+(s.verdict==="Removed"?`<div class="cap">${s.pct===0?T.nocode:T.leftover}</div>`:"")}</td>
    <td class="nw">${s.steps?`<button class="stp" data-id="${esc(s.id)}" aria-haspopup="dialog">`:'<div class="stp">'}${s.steps?s.steps.map((n,i)=>n?`<span class="tag ${["Sesuai","Sebagian","Beda","Tidak"][i]}">${n} ${T.sl[i]}</span>`:"").join("")||'<span class="z">-</span>':'<span class="z">-</span>'}${s.steps?"</button>":"</div>"}</td>
    <td class="nw">${s.link?`<a class="btn" href="${esc(s.link)}">${T.open}</a>`:""}</td></tr>`).join("")+"</tbody></table></div></details>";
  }).join("");
  document.getElementById("list").innerHTML=out||`<div class="empty">${T.none}</div>`;
}
const dlg=document.getElementById("dlg");
function openSteps(id){

function openNew(id){

   +(x.dlink?`<p><a class="btn" href="${esc(x.dlink)}">${esc(NT.f.diag)}</a></p>`:"")

  dlg.showModal();

tabsEl.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button[data-v]");if(b)showView(b.dataset.v)});
